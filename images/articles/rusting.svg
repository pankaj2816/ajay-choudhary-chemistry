<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Inter, Arial, sans-serif">
  <rect width="1200" height="675" fill="#F8FAFC"/>
  <rect x="120" y="360" width="960" height="120" rx="10" fill="#94A3B8"/>
  <text x="600" y="435" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">iron (Fe)</text>
  <path d="M380 360 Q420 300 470 330 Q520 290 560 330 Q600 300 640 345 Q700 305 760 360Z" fill="#60A5FA" opacity="0.8"/>
  <text x="570" y="290" text-anchor="middle" font-size="24" fill="#1E3A8A" font-weight="600">water drop</text>
  <ellipse cx="560" cy="372" rx="60" ry="14" fill="#B45309"/>
  <ellipse cx="300" cy="364" rx="50" ry="10" fill="#B45309"/>
  <ellipse cx="900" cy="366" rx="70" ry="12" fill="#C2410C"/>
  <g font-size="26" fill="#0F172A">
    <text x="150" y="140" font-weight="700">Iron gives away electrons:</text>
    <text x="150" y="180">Fe → Fe²⁺ + 2e⁻</text>
    <text x="700" y="140" font-weight="700">Oxygen takes them:</text>
    <text x="700" y="180">O₂ + 4H⁺ + 4e⁻ → 2H₂O</text>
  </g>
  <text x="600" y="580" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A">Rust needs both water and oxygen: a tiny battery on the metal surface</text>
  <text x="600" y="625" text-anchor="middle" font-size="24" fill="#475569">Fe₂O₃·xH₂O (rust) forms where the iron is eaten away</text>
</svg>
