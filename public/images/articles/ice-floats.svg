<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Inter, Arial, sans-serif">
  <rect width="1200" height="675" fill="#EFF6FF"/>
  <rect y="300" width="1200" height="375" fill="#BFDBFE"/>
  <path d="M0 300 Q150 285 300 300 T600 300 T900 300 T1200 300 V320 H0Z" fill="#93C5FD"/>
  <!-- iceberg -->
  <polygon points="500,300 550,240 600,255 650,225 700,300" fill="#FFFFFF" stroke="#60A5FA" stroke-width="4"/>
  <polygon points="500,300 700,300 790,430 730,560 470,560 410,430" fill="#E0F2FE" opacity="0.9" stroke="#60A5FA" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="600" y="445" text-anchor="middle" font-size="26" fill="#1E3A8A" font-weight="600">about 90% under water</text>
  <!-- left panel: ice lattice -->
  <g transform="translate(70,70)">
    <rect width="300" height="210" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <text x="150" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">Ice: open cage</text>
    <g stroke="#93C5FD" stroke-width="3" fill="none">
      <polygon points="80,90 120,70 160,90 160,135 120,155 80,135"/>
      <polygon points="160,90 200,70 240,90 240,135 200,155 160,135"/>
      <polygon points="120,155 160,135 200,155 200,195 160,175 120,195" opacity="0.4"/>
    </g>
    <g fill="#2563EB">
      <circle cx="80" cy="90" r="9"/><circle cx="120" cy="70" r="9"/><circle cx="160" cy="90" r="9"/><circle cx="160" cy="135" r="9"/><circle cx="120" cy="155" r="9"/><circle cx="80" cy="135" r="9"/><circle cx="200" cy="70" r="9"/><circle cx="240" cy="90" r="9"/><circle cx="240" cy="135" r="9"/><circle cx="200" cy="155" r="9"/>
    </g>
  </g>
  <!-- right panel: liquid water -->
  <g transform="translate(830,70)">
    <rect width="300" height="210" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <text x="150" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">Water: packed closer</text>
    <g fill="#2563EB">
      <circle cx="70" cy="85" r="9"/><circle cx="100" cy="100" r="9"/><circle cx="130" cy="80" r="9"/><circle cx="160" cy="98" r="9"/><circle cx="190" cy="82" r="9"/><circle cx="222" cy="100" r="9"/><circle cx="85" cy="125" r="9"/><circle cx="115" cy="140" r="9"/><circle cx="145" cy="122" r="9"/><circle cx="178" cy="140" r="9"/><circle cx="208" cy="125" r="9"/><circle cx="238" cy="142" r="9"/><circle cx="72" cy="165" r="9"/><circle cx="102" cy="178" r="9"/><circle cx="135" cy="165" r="9"/><circle cx="166" cy="180" r="9"/><circle cx="198" cy="166" r="9"/><circle cx="230" cy="180" r="9"/>
    </g>
  </g>
  <text x="600" y="630" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A">Ice is about 9% less dense than liquid water</text>
</svg>
