<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Inter, Arial, sans-serif">
  <rect width="1200" height="675" fill="#EFF6FF"/>
  <circle cx="600" cy="320" r="122" fill="#FDE68A" stroke="#F59E0B" stroke-width="4"/>
  <g id="m">
    <line x1="0" y1="-50" x2="0" y2="-124" stroke="#0F172A" stroke-width="6"/>
    <circle cx="0" cy="-136" r="15" fill="#2563EB"/>
  </g>
  <g transform="translate(600,320)">
    <circle r="46" fill="#FDE68A"/>
    <text y="10" text-anchor="middle" font-size="26" font-weight="700" fill="#92400E">oil</text>
    <use href="#m" transform="rotate(0)"/><use href="#m" transform="rotate(24)"/><use href="#m" transform="rotate(48)"/><use href="#m" transform="rotate(72)"/><use href="#m" transform="rotate(96)"/><use href="#m" transform="rotate(120)"/><use href="#m" transform="rotate(144)"/><use href="#m" transform="rotate(168)"/><use href="#m" transform="rotate(192)"/><use href="#m" transform="rotate(216)"/><use href="#m" transform="rotate(240)"/><use href="#m" transform="rotate(264)"/><use href="#m" transform="rotate(288)"/><use href="#m" transform="rotate(312)"/><use href="#m" transform="rotate(336)"/>
  </g>
  <g transform="translate(110,120)">
    <rect width="300" height="150" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <circle cx="50" cy="55" r="16" fill="#2563EB"/>
    <text x="80" y="63" font-size="22" fill="#0F172A">head loves water</text>
    <line x1="34" y1="105" x2="66" y2="105" stroke="#0F172A" stroke-width="6"/>
    <text x="80" y="113" font-size="22" fill="#0F172A">tail loves oil</text>
  </g>
  <text x="600" y="620" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A">Soap tails grab the oil; the heads face the water and carry it away</text>
</svg>
